<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pantry Planner</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&display=swap');

:root{
  --bg:#f5f6f7; --surface:#ffffff; --border:#d7dbde; --text:#1a1d1f; --muted:#697280;
  --accent:#0e7c86; --accent-light:#e2f1f0;
  --accent2:#b45309; --accent2-light:#fdf0e0;
  --danger:#b3271e; --danger-bg:#fdeceb; --danger-border:#f0bdb8;
  --warn:#8a5a10; --warn-bg:#fdf3e2; --warn-border:#f0d9a8;
  --header-bg:#14282a; --header-text:#f2f5f4; --header-muted:#9fb8b8;
}
[data-theme="ink"]{
  --bg:#17181a; --surface:#202226; --border:#34373b; --text:#eef0f1; --muted:#9aa0a6;
  --accent:#e8823c; --accent-light:#3a2a1c;
  --accent2:#5b9bd5; --accent2-light:#1c2b3a;
  --danger:#e5675a; --danger-bg:#3a2220; --danger-border:#5c332e;
  --warn:#e0b25c; --warn-bg:#3a2f1c; --warn-border:#5c4a2e;
  --header-bg:#0f1011; --header-text:#f2ece5; --header-muted:#b89a7a;
}
[data-theme="citrus"]{
  --bg:#fff9ec; --surface:#ffffff; --border:#f0e0b8; --text:#2b2410; --muted:#9c8a5c;
  --accent:#8b3a62; --accent-light:#f6e5ee;
  --accent2:#e0932c; --accent2-light:#fdf0dc;
  --danger:#b3392f; --danger-bg:#fbe8e4; --danger-border:#eec3bb;
  --warn:#9c6a10; --warn-bg:#fbf0d8; --warn-border:#ecd898;
  --header-bg:#3d1a2c; --header-text:#fdf3f8; --header-muted:#d9a8c0;
}
[data-theme="fog"]{
  --bg:#fafafa; --surface:#ffffff; --border:#e2e2e2; --text:#171717; --muted:#757575;
  --accent:#3a5ba0; --accent-light:#e8edf6;
  --accent2:#55606b; --accent2-light:#eceef0;
  --danger:#a5352b; --danger-bg:#f7e9e7; --danger-border:#e6c4bf;
  --warn:#8a6a10; --warn-bg:#f6f0dc; --warn-border:#e6d8a0;
  --header-bg:#20242b; --header-text:#f2f4f7; --header-muted:#a9b4c2;
}
[data-theme="cobalt"]{
  --bg:#11151c; --surface:#1a2029; --border:#2c3444; --text:#eef1f6; --muted:#8b95a5;
  --accent:#4d8dff; --accent-light:#1c2c4a;
  --accent2:#e0a458; --accent2-light:#3a2e1c;
  --danger:#ef6b5e; --danger-bg:#3a2320; --danger-border:#5c332c;
  --warn:#e0b25c; --warn-bg:#3a2f1e; --warn-border:#5c4a2c;
  --header-bg:#0a0d12; --header-text:#eef1f6; --header-muted:#7b8aa3;
}
[data-theme="clay"]{
  --bg:#f2ece4; --surface:#fbf8f4; --border:#e0d3c2; --text:#2e2620; --muted:#8a7a68;
  --accent:#a1553c; --accent-light:#f2ddd3;
  --accent2:#5f7a8a; --accent2-light:#e6edf0;
  --danger:#a5352b; --danger-bg:#f2ddd7; --danger-border:#e0b8ac;
  --warn:#8a6a10; --warn-bg:#f2e6c8; --warn-border:#e0cf9c;
  --header-bg:#2e2018; --header-text:#f5ece2; --header-muted:#c2a68a;
}
[data-theme="birch"]{
  --bg:#faf9fb; --surface:#ffffff; --border:#e6e2ea; --text:#201e26; --muted:#79747f;
  --accent:#6a5b8a; --accent-light:#eae5f0;
  --accent2:#c98a4a; --accent2-light:#f5e8d8;
  --danger:#a5352b; --danger-bg:#f5e4e1; --danger-border:#e0bcb5;
  --warn:#8a6a10; --warn-bg:#f5efdc; --warn-border:#e0d4a0;
  --header-bg:#211d2b; --header-text:#f5f2f8; --header-muted:#a99bc2;
}

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background 0.2s,color 0.2s;}

/* Header */
.header{background:var(--header-bg);color:var(--header-text);padding:20px 24px 16px;position:relative;transition:background 0.2s;}
.header::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:3px;background:var(--accent);}
.header-row{display:flex;justify-content:space-between;align-items:center;}
.header h1{font-family:'IBM Plex Sans',sans-serif;font-size:24px;font-weight:700;letter-spacing:-0.3px;}
.header h1 em{font-style:normal;font-weight:400;color:var(--header-muted);}
.header-meta{font-size:12px;margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--header-muted);}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--header-muted);flex-shrink:0;display:inline-block;}
.sdot.live{background:var(--accent2);}
.sdot.err{background:var(--danger);}
.sdot.syncing{background:var(--accent);animation:pulse 1s ease-in-out infinite;}
.settings-btn{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.22);color:var(--header-text);border-radius:7px;padding:6px 12px;font-size:12px;font-weight:500;cursor:pointer;font-family:'IBM Plex Sans',sans-serif;transition:all 0.15s;}
.settings-btn:hover{background:rgba(255,255,255,0.2);}

/* Tab bar — index-tab style */
.tabbar{display:flex;background:var(--bg);border-bottom:2px solid var(--border);gap:4px;padding:8px 10px 0;}
.tab-item{flex:1;text-align:center;padding:11px 6px;font-size:11px;font-weight:600;letter-spacing:0.4px;text-transform:uppercase;color:var(--muted);cursor:pointer;background:var(--surface);border:2px solid var(--border);border-bottom:none;border-radius:7px 7px 0 0;transition:all 0.15s;position:relative;top:2px;}
.tab-item.active{color:var(--accent);border-color:var(--accent);top:0;font-weight:700;}
.tab-item:hover{color:var(--text);}

.content{max-width:1140px;margin:0 auto;padding:28px 20px 60px;}
.section-title{font-family:'IBM Plex Sans',sans-serif;font-size:20px;font-weight:700;letter-spacing:-0.2px;margin-bottom:4px;}
.section-desc{font-size:14px;color:var(--muted);margin-bottom:24px;}

.btn{font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:600;padding:9px 18px;border-radius:8px;border:none;cursor:pointer;transition:all 0.15s;display:inline-flex;align-items:center;gap:6px;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-primary:hover{filter:brightness(0.9);}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
.btn-secondary{background:var(--surface);color:var(--text);border:1.5px solid var(--border);}
.btn-secondary:hover{border-color:var(--accent);color:var(--accent);}
.btn-lg{padding:13px 28px;font-size:15px;border-radius:9px;}

.card{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;padding:20px;margin-bottom:16px;max-width:720px;margin-left:auto;margin-right:auto;}
.week-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;align-items:start;}
.week-grid .day-card{margin-bottom:0;}
.pantry-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start;}
.pantry-grid .cat-group{margin-bottom:0;}
.add-row{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.fi{font-family:'IBM Plex Sans',sans-serif;font-size:14px;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none;}
.fi:focus{border-color:var(--accent);}
.fi.name{flex:2;min-width:120px;}
.fi.qty{flex:1;min-width:80px;}
.fi.cat{flex:1.5;min-width:110px;}

.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px;}
.inv-count{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--accent-light);color:var(--accent);padding:2px 10px;border-radius:6px;font-weight:600;}
.cat-group{margin-bottom:14px;}
.cat-label{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
.inv-grid{display:flex;flex-wrap:wrap;gap:7px;}
.inv-chip{display:flex;align-items:center;gap:6px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:4px 10px 4px 12px;font-size:13px;}
.inv-chip .qty{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:11px;}
.inv-chip button{background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;line-height:1;padding:0;}
.inv-chip button:hover{color:var(--danger);}

.empty-state{text-align:center;padding:28px;color:var(--muted);font-size:14px;}
.empty-state .icon{font-size:32px;margin-bottom:8px;}

/* Pantry / Grocery checklists — "stamp" checkbox signature */
.pantry-list, .grocery-list{display:flex;flex-direction:column;gap:2px;margin-bottom:4px;}
.pantry-item, .grocery-item{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);}
.pantry-item:last-child, .grocery-item:last-child{border-bottom:none;}
.grocery-item.checked .grocery-text{text-decoration:line-through;color:var(--muted);}
.pantry-item:not(.stocked) .pantry-text{font-style:italic;color:var(--muted);}
.pantry-check, .grocery-check{display:inline-flex;cursor:pointer;flex-shrink:0;}
.pantry-checkmark, .grocery-checkmark{
  width:22px;height:22px;border:2px solid var(--border);border-radius:6px;
  display:flex;align-items:center;justify-content:center;
  background:var(--surface);transition:all 0.15s;
}
.pantry-checkmark svg, .grocery-checkmark svg{width:13px;height:13px;opacity:0;transform:scale(0.6);transition:opacity 0.15s,transform 0.15s;}
.pantry-item.stocked .pantry-checkmark, .grocery-item.checked .grocery-checkmark{
  background:var(--accent); border-color:var(--accent);
}
.pantry-item.stocked .pantry-checkmark svg, .grocery-item.checked .grocery-checkmark svg{opacity:1;transform:scale(1);}
.pantry-text, .grocery-text{flex:1;min-width:0;font-size:14px;}
.pantry-text{font-family:'IBM Plex Sans',sans-serif;color:var(--text);border:none;background:transparent;padding:3px 5px;border-radius:5px;outline:none;}
.pantry-text:focus{background:var(--bg);box-shadow:0 0 0 1.5px var(--accent);font-style:normal;}
.pantry-qty{font-family:'IBM Plex Mono',monospace;color:var(--muted);font-size:12px;width:66px;flex-shrink:0;border:none;background:transparent;padding:3px 5px;border-radius:5px;outline:none;text-align:right;}
.pantry-qty:focus{background:var(--bg);box-shadow:0 0 0 1.5px var(--accent);color:var(--text);text-align:left;}
.pantry-qty::placeholder{color:var(--border);}
.pantry-out-badge{font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-border);border-radius:6px;padding:2px 7px;flex-shrink:0;}
.pantry-add-grocery{font-size:11px;font-weight:600;padding:4px 10px;border-radius:14px;border:1px solid var(--accent);background:var(--accent-light);color:var(--accent);cursor:pointer;flex-shrink:0;white-space:nowrap;}
.pantry-add-grocery:disabled{opacity:0.6;cursor:default;border-color:var(--border);background:var(--bg);color:var(--muted);}
.grocery-source{font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:2px 7px;flex-shrink:0;}
.grocery-store-tag{font-family:'IBM Plex Sans',sans-serif;font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-light);border:1px solid var(--accent);border-radius:14px;padding:3px 10px;flex-shrink:0;cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.grocery-store-tag:hover{filter:brightness(0.95);}
.rm-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:20px;line-height:1;padding:0 4px;flex-shrink:0;}
.rm-btn:hover{color:var(--danger);}

/* Dietary toggles */
.diet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px;margin-bottom:24px;}
.diet-toggle{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;font-size:14px;user-select:none;transition:all 0.15s;}
.diet-toggle.active{border-color:var(--accent2);background:var(--accent2-light);color:var(--accent2);font-weight:600;}
.diet-toggle:hover{border-color:var(--accent);}

/* Household member editor */
.member-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;flex-wrap:wrap;}
.member-row input,.member-row select{font-family:'IBM Plex Sans',sans-serif;font-size:14px;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none;}
.member-row input:focus,.member-row select:focus{border-color:var(--accent);}
.mname{flex:2;min-width:100px;}
.mtype{flex:1;min-width:90px;}
.mage{width:64px;text-align:center;font-family:'IBM Plex Mono',monospace;}
.member-card{border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:var(--surface);}
.member-card .member-row{margin-bottom:8px;}
.member-bio{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.member-bio input,.member-bio select{font-family:'IBM Plex Sans',sans-serif;font-size:13px;padding:7px 10px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none;}
.member-bio input:focus,.member-bio select:focus{border-color:var(--accent);}
.mbio-num{width:64px;text-align:center;font-family:'IBM Plex Mono',monospace;}
.member-target{font-size:12px;color:var(--muted);font-family:'IBM Plex Mono',monospace;}

/* Fixed meals */
.fixed-item{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;background:var(--bg);border:1.5px solid var(--border);border-radius:8px;margin-bottom:6px;}
.fixed-day{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--accent);margin-right:8px;}
.fixed-form{background:var(--bg);border:1.5px solid var(--border);border-radius:8px;padding:14px;margin-top:8px;}
.fixed-form-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.fixed-form select,.fixed-form input{font-family:'IBM Plex Sans',sans-serif;font-size:14px;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);outline:none;}
.fixed-form select{flex:1;min-width:100px;}
.fixed-form input.fdesc{width:100%;margin-bottom:8px;}

.error-bar{background:var(--danger-bg);color:var(--danger);border-bottom:3px solid var(--danger-border);padding:12px 20px;font-size:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.error-bar button{background:none;border:none;cursor:pointer;color:var(--danger);font-size:20px;line-height:1;flex-shrink:0;}
.warn-banner{font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:16px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-border);}

.loading-wrap{text-align:center;padding:60px 24px;}
.loading-wrap .ltitle{font-family:'IBM Plex Sans',sans-serif;font-size:20px;font-weight:700;margin-bottom:10px;}
.loading-wrap p{font-size:14px;color:var(--muted);margin-bottom:20px;}
.dots{display:inline-flex;gap:5px;align-items:center;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite;}
.dot:nth-child(2){animation-delay:0.2s;}
.dot:nth-child(3){animation-delay:0.4s;}
@keyframes pulse{0%,100%{opacity:0.3;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}}

/* Day cards */
.day-card{background:var(--surface);border:1.5px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden;}
.day-card.hero-day{border:2px solid var(--accent);box-shadow:0 4px 16px rgba(0,0,0,0.06);}
.day-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;cursor:pointer;user-select:none;}
.day-name{font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:700;}
.day-card.hero-day .day-name{font-size:19px;}
.meal-badge{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);background:var(--bg);padding:2px 9px;border-radius:6px;border:1px solid var(--border);}
.chevron{color:var(--muted);font-size:11px;transition:transform 0.2s;margin-left:8px;}
.chevron.open{transform:rotate(180deg);}
.day-meals{border-top:1px solid var(--border);display:none;}
.day-meals.open{display:block;}
.meal-row{padding:14px 18px;border-bottom:1px solid var(--border);}
.meal-row:last-child{border-bottom:none;}
.meal-type{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:3px;}
.meal-name{font-family:'IBM Plex Sans',sans-serif;font-size:15px;font-weight:600;margin-bottom:9px;}
.ingredients{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px;}
.ing-tag{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:2px 9px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
.ing-tag.need{border-color:var(--warn-border);background:var(--warn-bg);color:var(--warn);}
.recipe-block{padding:10px 12px;background:var(--bg);border-radius:8px;border-left:3px solid var(--accent);}
.recipe-title{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:7px;}
.recipe-step{display:flex;gap:8px;font-size:13px;line-height:1.5;margin-bottom:5px;}
.recipe-step:last-child{margin-bottom:0;}
.step-num{flex-shrink:0;width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px;}

/* Nutrition chips — theme-safe, data-forward */
.nutri-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center;}
.nutri-chip{display:inline-flex;align-items:baseline;gap:4px;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:4px 10px;}
.nutri-num{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px;color:var(--text);}
.nutri-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.3px;}
.nutri-serving{font-size:12px;color:var(--muted);}
.nutri-note{font-size:11px;color:var(--muted);width:100%;}

.shopping-card{background:var(--accent2-light);border:1.5px solid var(--accent2);border-radius:10px;padding:18px 22px;margin-top:20px;}
.shopping-title{font-family:'IBM Plex Sans',sans-serif;font-size:16px;font-weight:700;color:var(--accent2);margin-bottom:12px;}
.shopping-grid{display:flex;flex-wrap:wrap;gap:7px;}
.shop-item{font-family:'IBM Plex Mono',monospace;font-size:12px;background:var(--surface);border:1px solid var(--accent2);border-radius:6px;padding:4px 11px;color:var(--accent2);}

/* Settings / Preferences overlay */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.settings-panel{background:var(--surface);border-radius:12px;width:100%;max-width:480px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,0.25);max-height:90vh;overflow-y:auto;border:1.5px solid var(--border);}
.settings-title{font-family:'IBM Plex Sans',sans-serif;font-size:20px;font-weight:700;margin-bottom:6px;}
.settings-desc{font-size:13px;color:var(--muted);margin-bottom:20px;line-height:1.6;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.field input{width:100%;font-family:'IBM Plex Sans',sans-serif;font-size:14px;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none;}
.field input:focus{border-color:var(--accent);}
.field-note{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4;}
.settings-section{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--muted);margin:20px 0 12px;padding-top:16px;border-top:1px solid var(--border);}
.settings-actions{display:flex;gap:10px;margin-top:24px;justify-content:flex-end;}

/* Theme picker */
.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:8px;}
.theme-swatch{cursor:pointer;border:2px solid var(--border);border-radius:10px;padding:8px;text-align:center;transition:all 0.15s;background:var(--surface);}
.theme-swatch.active{border-color:var(--accent);}
.theme-preview{height:34px;border-radius:6px;margin-bottom:6px;display:flex;overflow:hidden;border:1px solid rgba(0,0,0,0.08);}

// ── Default Prompts ───────────────────────────────────────────────────────────
const DEFAULT_PROMPT_WEEK = `You are an expert meal planner specializing in fast, family-friendly weeknight dinners. Generate DINNER ONLY for: {DAYS}.

{CONTEXT}

REQUIREMENTS:
- Each dinner must be realistically cookable in 30 minutes or less.
- Prioritize using pantry ingredients; minimize new shopping items.
- Mark any ingredient NOT in the pantry with a leading * (e.g. "*fresh basil").
- Include specific quantities for every ingredient (e.g. "2 chicken breasts", "1 cup rice").
- Recipe steps must include cook times and temperatures where relevant (e.g. "Sauté 5 min over medium heat").
- Ensure VARIETY across the week: vary proteins, cuisines, and cooking methods. No repeated main dishes.
- Make meals genuinely kid-friendly for young children: mild spice, soft textures, familiar flavors. Suggest simple modifications for kids where helpful (e.g. "set aside plain portion before adding sauce").
- Respect all dietary preferences and fixed meals exactly. Never include avoided ingredients.

Respond ONLY in this JSON, no markdown:
{"days":[{"day":"Monday","dinner":{"name":"...","ingredients":["2 chicken breasts","*1 lime"],"recipe":["Step with time/temp","Step 2"],"nutrition":{"calories":450,"protein":38,"carbs":32,"fat":14,"servingSize":"1.5 cups","kidsServing":"3/4 cup"}}}],"shopping_list":["item with qty"]}

const DEFAULT_PROMPT_DAY = `You are an expert meal planner specializing in fast, family-friendly weeknight dinners. Generate ONE dinner for {DAY}.

{CONTEXT}
{FIXED}
{EXISTING}
{INSTRUCTION}

REQUIREMENTS:
- Must be realistically cookable in 30 minutes or less.
- Prioritize pantry ingredients; minimize new shopping items.
- Mark any ingredient NOT in the pantry with a leading * (e.g. "*fresh basil").
- Include specific quantities for every ingredient.
- Recipe steps must include cook times and temperatures where relevant.
- Must be DIFFERENT from the dinners already planned this week.
- Genuinely kid-friendly: mild spice, soft textures, familiar flavors.
- Respect dietary preferences and fixed meals exactly. Never include avoided ingredients.

Respond ONLY in this JSON, no markdown:
{"dinner":{"name":"...","ingredients":["2 chicken breasts","*1 lime"],"recipe":["Step with time/temp","Step 2"],"nutrition":{"calories":450,"protein":38,"carbs":32,"fat":14,"servingSize":"1.5 cups","kidsServing":"3/4 cup"}},"shopping_list":["item with qty"]}`;


// ── Nutrition Helpers ─────────────────────────────────────────────────────────
function toKg(w, unit){ return unit==="imperial" ? w*0.453592 : w; }
function toCm(h, unit){ 
  if(unit==="imperial"){
    const parts=String(h).split("'");
    const ft=parseFloat(parts[0])||0, inch=parseFloat(parts[1])||0;
    return ft*30.48 + inch*2.54;
  }
  return parseFloat(h)||0;
}

function calcTDEE(member){
  const age=parseFloat(member.age)||0;
  const weightKg=toKg(parseFloat(member.weight)||0, member.unit||"imperial");
  const heightCm=toCm(member.height||"", member.unit||"imperial");
  const activityMultiplier={sedentary:1.2,light:1.375,moderate:1.55,active:1.725,very_active:1.9}[member.activity||"moderate"]||1.55;
  
  // Non-adults (child/toddler): simple age-based estimate, ~1000 + 100*age kcal/day.
  // (An earlier version routed toddlers >=2 through Mifflin-St Jeor, but they never
  // have sex/height/weight filled in, which produced NEGATIVE targets in the AI prompt.)
  if(member.type!=="adult"){
    return age>0 ? Math.round(1000 + 100*age) : null;
  }

  // Adults: Mifflin-St Jeor. Requires real biometrics — with weight/height missing
  // the formula degenerates to garbage (e.g. -161 BMR for sex!=="male"), so return
  // null ("unknown") instead of guessing. Sex must be explicit too: a blank sex
  // would silently apply the female constant (~166 kcal off for males). This is
  // the single place a target number is produced; householdNutritionSummary and
  // the Preferences editor render null as "unknown".
  if(!(weightKg>0) || !(heightCm>0) || (member.sex!=="male"&&member.sex!=="female")) return null;
  const isMale=member.sex==="male";
  const bmr = isMale
    ? 10*weightKg + 6.25*heightCm - 5*age + 5
    : 10*weightKg + 6.25*heightCm - 5*age - 161;
  const goalAdj={lose:-500,maintain:0,gain:300}[member.goal||"maintain"]||0;
  const tdee = Math.round(bmr * activityMultiplier + goalAdj);
  return tdee>=500 ? tdee : null; // sanity floor: anything lower is bad input, not a real target
}

function householdNutritionSummary(){
  return S.household.map(m=>{
    const tdee=calcTDEE(m);
    return m.name+" ("+m.type+(m.age?", age "+m.age:"")+", target: "+(tdee||"unknown")+" kcal/day)";
  }).join("; ");
}

// User-facing rendering of the calcTDEE contract (null = unknown), naming what's
// missing so the editor is self-explaining. Text only — no color-coded status.
function tdeeLabel(m){
  const t=calcTDEE(m);
  if(t) return "Target: ~"+t.toLocaleString()+" kcal/day ("+(m.type==="adult"?(m.goal||"maintain"):"age-based estimate")+")";
  if(m.type!=="adult") return "Target: unknown — add age";
  const missing=[];
  if(!(parseFloat(m.weight)>0)) missing.push("weight");
  if(!(toCm(m.height||"",m.unit||"imperial")>0)) missing.push("height");
  if(m.sex!=="male"&&m.sex!=="female") missing.push("sex");
  return "Target: unknown — add "+(missing.length?missing.join(", "):"valid height/weight");
}

// ── Storage ───────────────────────────────────────────────────────────────────
function ls(k,v){
  if(v===undefined){try{const x=localStorage.getItem(k);return x?JSON.parse(x):null;}catch(e){return null;}}
  try{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v));}catch(e){}
}

const SYNC_KEYS=["inventory","dietPrefs","household","avoid","fixedMeals","mealPlan","quickMeals","promptWeek","promptDay","groceryList"];

function loadAll(){
  S.inventory   = ls("inventory") || SEED;
  S.dietPrefs   = ls("dietPrefs") || [];
  S.household   = ls("household") || S.household;
  S.avoid       = ls("avoid") ?? "banana, avocado";
  S.fixedMeals  = ls("fixedMeals") || S.fixedMeals;
  S.mealPlan    = ls("mealPlan") || null;
  S.quickMeals  = ls("quickMeals") || S.quickMeals;
  S.groceryList = ls("groceryList") || [];
  S.promptWeek  = ls("promptWeek") || DEFAULT_PROMPT_WEEK;
  S.promptDay   = ls("promptDay") || DEFAULT_PROMPT_DAY;
  S.scriptUrl   = ls("scriptUrl") || "";
  S.userName    = ls("userName") || "";
  S.theme = ls("theme") || "slate";
  S.settingsDraft = {geminiKey:ls("geminiKey")||"", scriptUrl:S.scriptUrl, userName:S.userName, promptWeek:S.promptWeek, promptDay:S.promptDay};

}

function geminiKey(){ return ls("geminiKey")||""; }
function applyTheme(){ document.body.dataset.theme = S.theme; }
function setTheme(id){ S.theme=id; ls("theme",id); applyTheme(); render(); }


// ── Google Apps Script Sync ───────────────────────────────────────────────────
let syncTimer=null;      // non-null only while a debounced push is *waiting* to fire
let pushInFlight=false;  // true only while a push POST is actually in flight
let pollInterval=null;

function fmtTime(iso){
  if(!iso)return "";
  const d=new Date(iso),now=new Date(),diff=Math.floor((now-d)/60000);
  if(diff<1)return "just now";
  if(diff<60)return diff+"m ago";
  const h=Math.floor(diff/60);
  return h<24?h+"h ago":d.toLocaleDateString();
}

async function fetchSync(){
  if(!S.scriptUrl)return;
  // Lost-update guard: if a local edit is waiting to push (debounce armed) or a
  // push is mid-flight, the remote blob is staler than local state. Applying it
  // would overwrite the edit and the pending push would then persist the stale
  // data — silently, on both devices. Skip this cycle; the next poll catches up.
  if(syncTimer || pushInFlight) return;
  S.syncing=true; S.syncError=""; render();
  try{
    const res=await fetch(S.scriptUrl);
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    // Apply remote data to local state, save to localStorage
    SYNC_KEYS.forEach(k=>{
      if(data[k]!==undefined){
        S[k]=data[k];
        ls(k,data[k]);
      }
    });

    S.lastSynced=new Date().toISOString();
  }catch(e){ S.syncError="Sync failed: "+e.message; }
  S.syncing=false; render();
}

function pushSync(){
  if(!S.scriptUrl)return;
  clearTimeout(syncTimer);
  syncTimer=setTimeout(async()=>{
    syncTimer=null; pushInFlight=true;
    S.syncing=true; render();
    try{
      const payload={updatedBy:S.userName||"unknown"};
      SYNC_KEYS.forEach(k=>{ payload[k]=S[k]; });
      const res=await fetch(S.scriptUrl,{
        method:"POST",
        headers:{"Content-Type":"text/plain"},
        body:JSON.stringify(payload)
      });
      if(!res.ok)throw new Error("HTTP "+res.status);
      S.lastSynced=new Date().toISOString();
      S.syncError="";
    }catch(e){ S.syncError="Sync failed: "+e.message; }
    pushInFlight=false;
    S.syncing=false; render();
  },1000);
}

function startPolling(){
  if(pollInterval)clearInterval(pollInterval);
  if(S.scriptUrl) pollInterval=setInterval(fetchSync,60000);
}

// ── Actions ───────────────────────────────────────────────────────────────────
function setAndSync(key,value){
  S[key]=value; ls(key,value); pushSync(); render();
}

function setInv(items){ setAndSync("inventory",items); }
function addItem(){
  const name=S.newItem.name.trim(); if(!name)return;
  setInv([...S.inventory,{id:Date.now(),name,qty:S.newItem.qty,category:S.newItem.category,stocked:true}]);
  S.newItem={name:"",qty:"",category:S.newItem.category};
}
function removeItem(id){ setInv(S.inventory.filter(i=>i.id!==id)); }
function updateInventoryItem(id,field,value){
  const updated=S.inventory.map(i=>i.id===id?{...i,[field]:value}:i);
  setAndSync("inventory", updated);
}

// An item counts as stocked unless explicitly marked false — this keeps
// already-synced inventories (saved before this field existed) showing as
// stocked by default instead of suddenly appearing all "out of stock".
function isStocked(item){ return item.stocked!==false; }

function toggleStocked(id){
  const updated=S.inventory.map(i=>i.id===id?{...i, stocked: !isStocked(i)}:i);
  setAndSync("inventory", updated);
}

function addInventoryItemToGrocery(id){
  const item=S.inventory.find(i=>i.id===id);
  if(!item) return;
  addGroceryItem(item.name, "pantry");
}

// Bulk-adds every currently unstocked pantry item to the grocery list,
// deduped against what's already there.
function addUnstockedToGrocery(){
  const unstocked=S.inventory.filter(i=>!isStocked(i));
  if(!unstocked.length) return;
  const seen=new Set(S.groceryList.map(g=>g.text.trim().toLowerCase()));
  const added=[];
  unstocked.forEach((item,i)=>{
    const norm=item.name.trim().toLowerCase();
    if(!norm||seen.has(norm)) return;
    seen.add(norm);
    added.push({id:Date.now()+i, text:item.name.trim(), checked:false, source:"pantry", store:"either"});
  });
  if(!added.length) return;
  setAndSync("groceryList", [...S.groceryList, ...added]);
}

function togglePref(id){
  const updated=S.dietPrefs.includes(id)?S.dietPrefs.filter(p=>p!==id):[...S.dietPrefs,id];
  setAndSync("dietPrefs",updated);
}

function updateMember(id,field,value){
  const updated=S.household.map(m=>m.id===id?{...m,[field]:value}:m);
  setAndSync("household",updated);
}
function addMember(){
  // Seed the full member shape (one shape everywhere) — biometrics left blank,
  // which calcTDEE reports as "unknown" rather than computing a bogus target.
  setAndSync("household",[...S.household,{id:Date.now(),name:"",type:"adult",age:"",sex:"",height:"",weight:"",unit:"imperial",activity:"moderate",goal:"maintain"}]);
}
function removeMember(id){
  setAndSync("household",S.household.filter(m=>m.id!==id));
}

function addFixedMeal(){
  const desc=S.newFixed.description.trim(); if(!desc)return;
  const updated=[...S.fixedMeals,{id:Date.now(),...S.newFixed,description:desc}];
  setAndSync("fixedMeals",updated);
  S.newFixed={day:"Monday",mealType:"dinner",description:""};
  S.showFixedForm=false; render();
}
function removeFixedMeal(id){
  setAndSync("fixedMeals",S.fixedMeals.filter(m=>m.id!==id));
}

function addQuickMeal(type){
  const val=S.newQuick[type].trim(); if(!val)return;
  const updated={...S.quickMeals,[type]:[...S.quickMeals[type],val]};
  S.newQuick[type]="";
  setAndSync("quickMeals",updated);
}
function removeQuickMeal(type,idx){
  const updated={...S.quickMeals,[type]:S.quickMeals[type].filter((_,i)=>i!==idx)};
  setAndSync("quickMeals",updated);
}

// Adds one item, deduped case-insensitively against existing items.
function addGroceryItem(text, source, store){
  const norm=text.trim().toLowerCase();
  if(!norm) return;
  if(S.groceryList.some(i=>i.text.trim().toLowerCase()===norm)) return;
  const item={id:Date.now()+Math.random(), text:text.trim(), checked:false, source:source||"manual", store:store||"either"};
  setAndSync("groceryList", [...S.groceryList, item]);
}
function addGroceryFromInput(){
  const text=(S.newGroceryItem||"").trim();
  if(!text) return;
  addGroceryItem(text,"manual",S.newGroceryStore||"grocery");
  S.newGroceryItem="";
  render();
}
function cycleGroceryStore(id){
  const order=["grocery","costco","either"];
  const updated=S.groceryList.map(i=>{
    if(i.id!==id) return i;
    const next=order[(order.indexOf(i.store||"either")+1)%order.length];
    return {...i, store:next};
  });
  setAndSync("groceryList", updated);
}
function cycleNewGroceryStore(){
  const order=["grocery","costco","either"];
  S.newGroceryStore=order[(order.indexOf(S.newGroceryStore||"grocery")+1)%order.length];
  render();
}
function toggleGroceryChecked(id){
  const updated=S.groceryList.map(i=>i.id===id?{...i,checked:!i.checked}:i);
  setAndSync("groceryList", updated);
}
function removeGroceryItem(id){
  setAndSync("groceryList", S.groceryList.filter(i=>i.id!==id));
}
function clearCheckedGroceries(){
  setAndSync("groceryList", S.groceryList.filter(i=>!i.checked));
}
// Pulls the AI-generated shopping list from the current meal plan into the
// grocery list, skipping anything already present (case-insensitive).
function importPlanGroceries(){
  const list=S.mealPlan?.shopping_list;
  if(!list||!list.length) return;
  const seen=new Set(S.groceryList.map(i=>i.text.trim().toLowerCase()));
  const added=[];
  list.forEach((t,i)=>{
    const norm=String(t).trim().toLowerCase();
    if(!norm||seen.has(norm)) return;
    seen.add(norm);
    added.push({id:Date.now()+i, text:String(t).trim(), checked:false, source:"plan", store:"either"});
  });
  if(!added.length) return;
  setAndSync("groceryList", [...S.groceryList, ...added]);
}

function resetHousehold(){
  const defaults=[
    {id:1,name:"Adult 1",type:"adult",age:"",sex:"male",height:"5'10",weight:"170",unit:"imperial",activity:"moderate",goal:"maintain"},
    {id:2,name:"Adult 2",type:"adult",age:"",sex:"female",height:"5'5",weight:"140",unit:"imperial",activity:"moderate",goal:"maintain"},
    {id:3,name:"Child 1",type:"child",age:"3",sex:"",height:"",weight:"",unit:"imperial",activity:"moderate",goal:"maintain"},
    {id:4,name:"Child 2",type:"child",age:"1",sex:"",height:"",weight:"",unit:"imperial",activity:"moderate",goal:"maintain"},
  ];
  setAndSync("household", defaults);
}

function saveSettings(){
  ls("geminiKey",S.settingsDraft.geminiKey);
  S.scriptUrl=S.settingsDraft.scriptUrl.trim();
  S.userName=S.settingsDraft.userName.trim();
  ls("scriptUrl",S.scriptUrl);
  ls("userName",S.userName);
  S.promptWeek=S.settingsDraft.promptWeek||DEFAULT_PROMPT_WEEK;
  S.promptDay=S.settingsDraft.promptDay||DEFAULT_PROMPT_DAY;
  ls("promptWeek",S.promptWeek);
  ls("promptDay",S.promptDay);
  S.showSettings=false;
  if(S.scriptUrl){ fetchSync(); startPolling(); }
  render();
}

function toggleDay(day){ S.expandedDay=S.expandedDay===day?null:day; render(); }

async function regenSingleDay(day){
  const key=geminiKey();
  if(!key){S.generateError="No Gemini API key — tap ⚙ Settings.";render();return;}
  S.regenDay=day; S.generateError=""; render();

  const stockedItems=S.inventory.filter(isStocked);
  const inv=stockedItems.length
    ?stockedItems.map(i=>i.name+(i.qty?" ("+i.qty+")":"")+" ["+i.category+"]").join(", ")
    :"No specific items — assume a well-stocked kitchen";
  const diet=S.dietPrefs.length?S.dietPrefs.map(p=>DIET_OPTIONS.find(o=>o.id===p)?.label).join(", "):"No restrictions";
  const household=S.household.map(m=>m.name+" ("+m.type+(m.age?", age "+m.age:"")+")").join(", ");
  const fixed=S.fixedMeals.find(m=>m.day===day&&m.mealType==="dinner");
  const avoid=S.avoid.trim()||"none";

  // Get existing dinners to avoid repeating them
  const existing=(S.mealPlan?.days||[])
    .filter(d=>d.day!==day)
    .map(d=>{const din=d.dinner||(d.meals?.dinner); return din?d.day+": "+din.name:null;})
    .filter(Boolean).join(", ");

  const ctxLines=[
    "PANTRY: "+inv,
    "DIET: "+diet,
    "AVOID: "+avoid,
    "HOUSEHOLD: "+household+" (children under 5 need soft textures, mild flavors)",
    "HOUSEHOLD NUTRITION TARGETS: "+householdNutritionSummary(),
  ].join("\n");
  const instruction=(S.dayInstructions[day]||"").trim();
  const instructionLine=instruction?"SPECIAL REQUEST FOR THIS MEAL (follow this): "+instruction:"";
  let prompt=(S.promptDay||DEFAULT_PROMPT_DAY)
    .replace(/\{DAY\}/g, day)
    .replace(/\{CONTEXT\}/g, ctxLines)
    .replace(/\{FIXED\}/g, fixed?"FIXED: This dinner must be: "+fixed.description:"")
    .replace(/\{EXISTING\}/g, existing?"ALREADY PLANNED THIS WEEK (do not repeat): "+existing:"")
    .replace(/\{INSTRUCTION\}/g, instructionLine);
  // Fallback for a saved custom prompt that predates the {INSTRUCTION} placeholder —
  // still honor the request by appending it rather than silently dropping it.
  if(instructionLine && !prompt.includes(instructionLine)) prompt += "\n\n"+instructionLine;
  try{
    const text=await callGemini(key,prompt);
    const data=cleanJson(text);
    const dinner=data.dinner;
    if(!dinner)throw new Error("No dinner in response");
    // Update just this day in the plan
    const updatedDays=S.mealPlan.days.map(d=>{
      if(d.day!==day)return d;
      return {...d, dinner};
    });
    // Merge shopping lists
    const newItems=(data.shopping_list||[]).filter(i=>!S.mealPlan.shopping_list?.includes(i));
    const updatedPlan={...S.mealPlan, days:updatedDays, shopping_list:[...(S.mealPlan.shopping_list||[]),...newItems]};
    S.mealPlan=updatedPlan;
    setAndSync("mealPlan",updatedPlan);
    S.expandedDay=day; // auto-expand to show the new meal
  }catch(e){S.generateError="Error regenerating "+day+": "+e.message;}
  S.regenDay=null; render();
}

// ── AI Response Validation ────────────────────────────────────────────────────
// Gemini controls the "day" strings in its response, and those strings are later
// interpolated into inline onclick handlers ('toggleDay(\'...\')') and used as
// object keys — contexts esc() doesn't fully cover. So the invariant is enforced
// here, at the single point where AI day data enters the plan: every day must
// match the DAYS whitelist (case-insensitive → canonical casing). This also fixes
// a real correctness bug: a lowercase "monday" previously sorted to the end
// (indexOf === -1) and never matched the hero "Today" card.
function normalizeDays(days){
  if(!Array.isArray(days)) throw new Error("AI response missing days array");
  const out=[];
  days.forEach(d=>{
    const canon=DAYS.find(x=>x.toLowerCase()===String(d&&d.day||"").trim().toLowerCase());
    if(canon) out.push({...d, day:canon});
  });
  if(!out.length) throw new Error("AI response contained no recognizable day names");
  return out;
}

// ── JSON Cleaner ─────────────────────────────────────────────────────────────
function cleanJson(text){
  let s=text.replace(/```json|```/g,"").trim();
  const start=s.indexOf('{'), end=s.lastIndexOf('}');
  if(start!==-1&&end!==-1) s=s.slice(start,end+1);
  s=s.replace(/\\n/g,' ').replace(/\\t/g,' ').replace(/\\r/g,' ');
  s=s.replace(/[\x00-\x1F\x7F]/g,' ');
  s=s.replace(/,\s*([}\]])/g,'$1');
  s=s.replace(/"\s+"/g,'", "');
  try{
    return JSON.parse(s);
  }catch(e){
    console.error("JSON parse failed:", e.message, "\nRaw:", s.slice(0,300));
    throw new Error("Could not parse AI response. Please try regenerating.");
  }
}

// ── Generate Plan ─────────────────────────────────────────────────────────────
async function callGemini(key,prompt){
  const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key="+key,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.7,maxOutputTokens:65536}})
  });
  if(!res.ok){const t=await res.text();throw new Error("API error "+res.status+": "+t.slice(0,200));}
  const data=await res.json();
  const finishReason=data.candidates?.[0]?.finishReason;
  const text=data.candidates?.[0]?.content?.parts?.[0]?.text;
  if(!text)throw new Error("No text in response: "+JSON.stringify(data).slice(0,200));
  if(finishReason&&finishReason!=="STOP")throw new Error("Generation stopped: "+finishReason);
  return text;
}

async function generatePlan(){
  const key=geminiKey();
  if(!key){S.generateError="No Gemini API key — tap ⚙ Settings.";render();return;}
  S.loading=true; S.generateError=""; S.mealPlan=null; ls("mealPlan",null); render();

  const stockedItems=S.inventory.filter(isStocked);
  const inv=stockedItems.length
    ?stockedItems.map(i=>i.name+(i.qty?" ("+i.qty+")":"")+" ["+i.category+"]").join(", ")
    :"No specific items — assume a well-stocked kitchen";
  const diet=S.dietPrefs.length?S.dietPrefs.map(p=>DIET_OPTIONS.find(o=>o.id===p)?.label).join(", "):"No restrictions";
  const household=S.household.map(m=>m.name+" ("+m.type+(m.age?", age "+m.age:"")+")").join(", ");
  const fixed=S.fixedMeals.length?S.fixedMeals.map(m=>"- "+m.day+" "+m.mealType+": "+m.description).join("\n"):"None";
  const avoid=S.avoid.trim()||"none";

  const makePrompt=(days)=>{
    const ctx="PANTRY: "+inv+"\nDIET: "+diet+"\nAVOID: "+avoid
      +"\nHOUSEHOLD: "+household+" (children under 5 need soft textures, mild flavors)"
      +"\nHOUSEHOLD NUTRITION TARGETS: "+householdNutritionSummary()
      +"\nFIXED MEALS:\n"+fixed;
    return (S.promptWeek||DEFAULT_PROMPT_WEEK)
      .replace(/\{DAYS\}/g, days.join(", "))
      .replace(/\{CONTEXT\}/g, ctx);
  };

  try{
    const [res1,res2]=await Promise.all([
      callGemini(key,makePrompt(["Monday","Tuesday","Wednesday","Thursday"])),
      callGemini(key,makePrompt(["Friday","Saturday","Sunday"])),
    ]);
    const p1=cleanJson(res1), p2=cleanJson(res2);
    const allDays=normalizeDays([...(p1.days||[]),...(p2.days||[])]);
    allDays.sort((a,b)=>DAYS.indexOf(a.day)-DAYS.indexOf(b.day));
    const shopping=[...new Set([...(p1.shopping_list||[]),...(p2.shopping_list||[])])];
    // Normalise: support both {dinner:{...}} and {meals:{dinner:{...}}} from Gemini
    allDays.forEach(d=>{
      if(!d.dinner && d.meals?.dinner) d.dinner=d.meals.dinner;
    });
    S.mealPlan={days:allDays,shopping_list:shopping};
    setAndSync("mealPlan",S.mealPlan);
    S.view="plan";
  }catch(e){S.generateError="Error: "+e.message;}
  S.loading=false; render();
}

  const parts=[];

function renderMealCard(meal){
  if(!meal)return '<div style="font-size:13px;color:var(--muted);font-style:italic">No meal planned</div>';
  const ings=(meal.ingredients||[]).map(ing=>{
    const need=ing.startsWith("*");
    return '<span class="ing-tag'+(need?" need":"")+'">'+esc(need?"🛒 "+ing.slice(1).trim():ing)+'</span>';
  }).join("");
  const steps=(meal.recipe||[]).map((s,i)=>'<div class="recipe-step"><span class="step-num">'+(i+1)+'</span><span>'+esc(s)+'</span></div>').join("");
  const n=meal.nutrition;
  const nutriChip=(num,label)=>'<span class="nutri-chip"><span class="nutri-num">'+num+'</span><span class="nutri-label">'+label+'</span></span>';
  const nutritionHtml=n?'<div class="nutri-row">'
    +nutriChip(n.calories,"kcal")
    +nutriChip(n.protein+"g","protein")
    +nutriChip(n.carbs+"g","carbs")
    +nutriChip(n.fat+"g","fat")
    +(n.servingSize?'<span class="nutri-serving">Adult: '+esc(n.servingSize)+(n.kidsServing?" · Kids: "+esc(n.kidsServing):"")+'</span>':"")
    +'<span class="nutri-note">* Estimates ±20%. Not medical advice.</span>'
    +'</div>':"";
  return '<div class="meal-name">'+esc(meal.name)+'</div>'
    +nutritionHtml
    +'<div class="ingredients">'+ings+'</div>'
    +(steps?'<div class="recipe-block"><div class="recipe-title">Recipe</div>'+steps+'</div>':"");
}

function renderQuickMeals(){
  const types=["breakfast","lunch"];
  const sections=types.map(type=>{
    const items=S.quickMeals[type]||[];
    const chips=items.length
      ?items.map((item,i)=>'<div class="inv-chip"><span>'+esc(item)+'</span><button onclick="removeQuickMeal(\''+type+'\','+i+')">×</button></div>').join("")
      :'<span style="font-size:13px;color:var(--muted);font-style:italic">No ideas yet</span>';
    return '<div style="margin-bottom:20px">'
      +'<div style="font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:8px">'+type+'</div>'
      +'<div class="inv-grid" style="margin-bottom:10px">'+chips+'</div>'
      +'<div style="display:flex;gap:8px">'
      +'<input class="fi" style="flex:1" placeholder="Add a '+type+' idea..." value="'+esc(S.newQuick[type]||"")+'" '
      +'oninput="S.newQuick[\''+type+'\']=this.value" onkeydown="if(event.key===\'Enter\')addQuickMeal(\''+type+'\')">'
      +'<button class="btn btn-primary" style="padding:8px 14px;font-size:13px" onclick="addQuickMeal(\''+type+'\')">+ Add</button>'
      +'</div></div>';
  }).join("");
  return '<div class="card" style="margin-top:24px">'
    +'<div style="font-family:\'IBM Plex Sans\',sans-serif;font-size:16px;font-weight:600;margin-bottom:4px">Quick Meal Ideas</div>'
    +'<div style="font-size:13px;color:var(--muted);margin-bottom:16px">Your go-to breakfasts and lunches. Synced with your household.</div>'
    +sections+'</div>';
}

function renderDayCard(dayData, isHero){
  const open=isHero||S.expandedDay===dayData.day;
  const dinner=dayData.dinner||(dayData.meals?.dinner);
  const isRegen=S.regenDay===dayData.day;
  const noteVal=S.dayInstructions[dayData.day]||"";
  const composer='<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">'
    +'<div style="font-size:12px;color:var(--muted);margin-bottom:6px">Want something different for '+dayData.day+'?</div>'
    +'<div style="display:flex;gap:8px">'
    +'<input placeholder="e.g. more veggies, use the shrimp" value="'+esc(noteVal)+'" '
    +'oninput="S.dayInstructions[\''+dayData.day+'\']=this.value" '
    +'onkeydown="if(event.key===\'Enter\')regenSingleDay(\''+dayData.day+'\')" '
    +'style="flex:1;font-family:\'IBM Plex Sans\',sans-serif;font-size:13px;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none">'
    +'<button class="btn btn-secondary" style="font-size:13px;padding:8px 14px;flex-shrink:0" '
    +'onclick="regenSingleDay(\''+dayData.day+'\')" '+(isRegen?"disabled":"")+'>↻ Redo</button>'
    +'</div></div>';
  return '<div class="day-card'+(isHero?" hero-day":"")+'">'
    +'<div class="day-header"'+(isHero?"":' onclick="toggleDay(\''+dayData.day+'\')"')+'>'
    +'<span class="day-name">'+(isHero?"Today · ":"")+dayData.day+'</span>'
    +'<div style="display:flex;align-items:center;gap:8px">'
    +(isRegen?'<span style="font-size:12px;color:var(--muted)">Regenerating…</span>'
      :(dinner&&!isHero?'<span class="meal-badge">'+esc(dinner.name)+'</span>':""))
    +'<button style="background:none;border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--muted)" '
    +'onclick="event.stopPropagation();regenSingleDay(\''+dayData.day+'\')" '
    +(isRegen?'disabled ':'')+'>↻</button>'
    +(isHero?"":'<span class="chevron'+(open?" open":"")+'">▼</span>')
    +'</div></div>'
    +'<div class="day-meals'+(open?" open":"")+'"><div class="meal-row">'
    +'<div class="meal-type">Dinner</div>'
    +renderMealCard(dinner)
    +composer
    +'</div></div></div>';
}

function renderPlanTab(){
  const noKey=!geminiKey();
  const summary=renderPrefsSummary();
  const warn=noKey?'<div class="warn-banner">⚠️ No Gemini API key — tap ⚙ Settings before generating.</div>':"";

  if(!S.mealPlan){
    return '<div class="content">'
      +summary+warn
      +'<div class="card" style="text-align:center;padding:40px 24px">'
      +'<div style="font-size:36px;margin-bottom:10px">🍽️</div>'
      +'<div class="section-title" style="margin-bottom:6px">No meal plan yet</div>'
      +'<p class="section-desc" style="margin-bottom:20px">Generate a week of fast, family-friendly dinners based on your pantry and preferences.</p>'
      +'<button class="btn btn-primary btn-lg" onclick="generatePlan()" '+(S.loading?"disabled":"")+'>'+( S.loading?dots()+" Generating…":"✨ Generate Meal Plan")+'</button>'
      +'</div></div>';
  }

  const today=todayDayName();
  const todayData=S.mealPlan.days.find(d=>d.day===today);
  const restDays=S.mealPlan.days.filter(d=>d.day!==today);

  const heroHtml=todayData?renderDayCard(todayData,true):"";
  const restHtml=restDays.map(d=>renderDayCard(d,false)).join("");

  const shopping=S.mealPlan.shopping_list?.length
    ?'<div class="shopping-card"><div class="shopping-title">🛒 Shopping List</div><div class="shopping-grid">'
      +S.mealPlan.shopping_list.map(i=>'<span class="shop-item">'+esc(i)+'</span>').join("")
      +'</div></div>':"";

  return '<div class="content">'
    +summary+warn
    +'<p class="section-desc" style="margin-top:-8px;margin-bottom:16px;font-size:12px">🛒 = needs shopping</p>'
    +(heroHtml?'<div class="cat-label">Today</div>'+heroHtml:"")
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px">'
    +'<h2 class="section-title" style="margin-bottom:0">This Week</h2>'
    +'<button class="btn btn-secondary" style="font-size:13px" onclick="generatePlan()">↻ Regenerate week</button>'
    +'</div>'
    +'<div class="week-grid">'+restHtml+'</div>'+shopping
    +renderQuickMeals()
    +'</div>';
}

function renderGrocery(){
  const unchecked=S.groceryList.filter(i=>!i.checked);
  const checked=S.groceryList.filter(i=>i.checked);
  const sourceLabel=s=>s==="siri"?"Siri":s==="plan"?"Meal Plan":s==="pantry"?"Pantry":"";
  const storeLabel=s=>s==="costco"?"Costco":s==="grocery"?"Grocery":"Either";

  const itemRow=item=>
    '<div class="grocery-item'+(item.checked?" checked":"")+'">'
    +'<label class="grocery-check">'
    +'<input type="checkbox" style="display:none" '+(item.checked?"checked":"")+' onchange="toggleGroceryChecked('+item.id+')">'
    +'<span class="grocery-checkmark"><svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 8.5L6.5 12L13 4.5" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>'
    +'</label>'
    +'<span class="grocery-text">'+esc(item.text)+'</span>'
    +(sourceLabel(item.source)?'<span class="grocery-source">'+sourceLabel(item.source)+'</span>':"")
    +(!item.checked?'<button class="grocery-store-tag" onclick="cycleGroceryStore('+item.id+')" title="Tap to change store">'+storeLabel(item.store)+'</button>':"")
    +'<button class="rm-btn" onclick="removeGroceryItem('+item.id+')">×</button>'
    +'</div>';

  const hasPlanItems=S.mealPlan?.shopping_list?.length>0;

  const groceryItems=unchecked.filter(i=>(i.store||"either")!=="costco");
  const costcoItems=unchecked.filter(i=>(i.store||"either")!=="grocery");

  const storeSection=(label,items)=>items.length
    ?'<div style="margin-bottom:18px"><div class="cat-label">'+label+' ('+items.length+')</div>'
      +'<div class="grocery-list">'+items.map(itemRow).join("")+'</div></div>'
    :"";

  return '<div class="content">'
    +'<div class="toolbar"><h2 class="section-title">Grocery List</h2>'
    +(S.groceryList.length?'<span class="inv-count">'+unchecked.length+' to get</span>':"")
    +'</div>'
    +'<p class="section-desc">Synced with your household'+(S.scriptUrl?' — say "Hey Siri, Groceries" to add by voice.':'.')+'</p>'
    +'<div class="card">'
    +'<div class="add-row">'
    +'<input class="fi" style="flex:1" placeholder="Add an item..." value="'+esc(S.newGroceryItem||"")+'" oninput="S.newGroceryItem=this.value" onkeydown="if(event.key===\'Enter\')addGroceryFromInput()">'
    +'<button class="grocery-store-tag" onclick="cycleNewGroceryStore()" title="Tap to change store" style="flex-shrink:0">'+storeLabel(S.newGroceryStore)+'</button>'
    +'<button class="btn btn-primary" onclick="addGroceryFromInput()">+ Add</button>'
    +'</div>'
    +(hasPlanItems?'<button class="btn btn-secondary" style="font-size:13px;margin-bottom:16px" onclick="importPlanGroceries()">↓ Add items from meal plan</button>':"")
    +(unchecked.length
      ?storeSection("🏪 Grocery Store",groceryItems)+storeSection("📦 Costco",costcoItems)
      :'<div class="empty-state"><div class="icon">🛒</div><div>Your grocery list is empty. Add items above'+(S.scriptUrl?' or by voice.':'.')+'</div></div>')
    +(checked.length
      ?'<div style="margin-top:20px">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
        +'<div class="cat-label">Checked off ('+checked.length+')</div>'
        +'<button class="btn btn-secondary" style="font-size:12px;padding:5px 11px" onclick="clearCheckedGroceries()">Clear checked</button>'
        +'</div>'
        +'<div class="grocery-list">'+checked.map(itemRow).join("")+'</div>'
        +'</div>'
      :"")
    +'</div></div>';
}


function renderSettings(){
  if(!S.showSettings)return "";
  const themeSwatches=THEMES.map(t=>
    '<div class="theme-swatch'+(S.theme===t.id?" active":"")+'" onclick="setTheme(\''+t.id+'\')">'
    +'<div class="theme-preview" style="background:'+t.bg+'"><span style="background:'+t.accent+'"></span><span style="background:'+t.accent2+'"></span></div>'
    +'<div class="theme-swatch-label">'+t.label+'</div>'
    +'</div>'
  ).join("");
  return '<div class="overlay" onclick="if(event.target===this){S.showSettings=false;render()}">'
    +'<div class="settings-panel">'
    +'<div class="settings-title">⚙️ Settings</div>'

    +'<div class="settings-section">Appearance</div>'
    +'<div class="theme-grid">'+themeSwatches+'</div>'
    +'<div class="field-note" style="margin-bottom:8px">Saved on this device only — each phone can pick its own.</div>'

    +'<div class="settings-section">AI</div>'
    +'<div class="field"><label>Gemini API Key</label>'
    +'<input type="password" placeholder="AIza..." value="'+esc(S.settingsDraft.geminiKey)+'" oninput="S.settingsDraft.geminiKey=this.value.trim()">'
    +'<div class="field-note">Stored only in this browser. Get a free key at <a href="https://aistudio.google.com" target="_blank" style="color:var(--accent)">aistudio.google.com</a></div></div>'

    +'<div class="settings-section">Sync</div>'
    +'<p class="settings-desc" style="margin-bottom:16px">Connect a Google Sheet to sync everything between you and your wife. <a href="https://script.google.com" target="_blank" style="color:var(--accent)">Set up in Google Apps Script →</a></p>'
    +'<div class="field"><label>Your Name</label>'
    +'<input placeholder="e.g. Ben" value="'+esc(S.settingsDraft.userName)+'" oninput="S.settingsDraft.userName=this.value">'
    +'<div class="field-note">Shows in sync status so you know who last updated.</div></div>'
    +'<div class="field"><label>Apps Script Web App URL</label>'
    +'<input placeholder="https://script.google.com/macros/s/..." value="'+esc(S.settingsDraft.scriptUrl)+'" oninput="S.settingsDraft.scriptUrl=this.value.trim()">'
    +'<div class="field-note">Paste the deployment URL after setting up the Apps Script.</div></div>'

    +'<div class="settings-section">Data</div>'
    +'<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:8px">'
    +'<div><div style="font-size:14px;font-weight:500">Reset household profiles</div>'
    +'<div style="font-size:12px;color:var(--muted);margin-top:2px">Clears saved members and reloads defaults with all fields</div></div>'
    +'<button class="btn btn-secondary" style="font-size:13px;padding:6px 14px;flex-shrink:0" onclick="resetHousehold();S.showSettings=false;render()">Reset</button>'
    +'</div>'
    +'<div class="settings-section">Prompts</div>'
    +'<p style="font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5">Customize how the AI generates your meal plan. Use {DAYS}, {CONTEXT}, {DAY}, {FIXED}, {EXISTING}, {INSTRUCTION} as placeholders. Changes sync to both devices.</p>'
    +'<div class="field"><label>Full Week Prompt</label>'
    +'<textarea style="width:100%;font-family:\'IBM Plex Mono\',monospace;font-size:12px;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none;min-height:160px;resize:vertical;line-height:1.5" oninput="S.settingsDraft.promptWeek=this.value">'+esc(S.settingsDraft.promptWeek||DEFAULT_PROMPT_WEEK)+'</textarea>'
    +'<div style="display:flex;justify-content:flex-end;margin-top:4px"><button style="font-size:11px;color:var(--accent);background:none;border:none;cursor:pointer" onclick="S.settingsDraft.promptWeek=DEFAULT_PROMPT_WEEK;render()">Reset to default</button></div>'
    +'</div>'
    +'<div class="field"><label>Single Day Prompt</label>'
    +'<textarea style="width:100%;font-family:\'IBM Plex Mono\',monospace;font-size:12px;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);outline:none;min-height:160px;resize:vertical;line-height:1.5" oninput="S.settingsDraft.promptDay=this.value">'+esc(S.settingsDraft.promptDay||DEFAULT_PROMPT_DAY)+'</textarea>'
    +'<div style="display:flex;justify-content:flex-end;margin-top:4px"><button style="font-size:11px;color:var(--accent);background:none;border:none;cursor:pointer" onclick="S.settingsDraft.promptDay=DEFAULT_PROMPT_DAY;render()">Reset to default</button></div>'
    +'</div>'
    +'<div class="settings-actions">'
    +'<button class="btn btn-secondary" onclick="S.showSettings=false;render()">Cancel</button>'
    +'<button class="btn btn-primary" onclick="saveSettings()">Save</button>'
    +'</div></div></div>';
}

function render(){
  // Don't re-render while user is actively typing — prevents keyboard dismissal on iOS
  const active = document.activeElement;
  const isTyping = active && (active.tagName==="INPUT"||active.tagName==="TEXTAREA");
  if(isTyping){
    S._pendingRender=true;
    return;
  }
  S._pendingRender=false;
  const scrollY = window.scrollY;
  let html=renderHeader()+renderTabs()+renderError();
  if(S.loading){
    html+='<div class="loading-wrap"><div class="ltitle">Crafting your week…</div><p>Planning 7 days of meals around your pantry.</p>'+dots()+'</div>';
  } else if(S.view==="inventory"){
    html+=renderInventory();
  } else if(S.view==="grocery"){
    html+=renderGrocery();
  } else {
    html+=renderPlanTab();
  }
  html+=renderSettings();
  html+=renderPreferencesModal();
  document.getElementById("app").innerHTML=html;
  window.scrollTo(0, scrollY);
}

loadAll();
applyTheme();
render();

// Flush any render that was blocked while keyboard was open
document.addEventListener('focusout', ()=>{
  setTimeout(()=>{
    if(S._pendingRender) render();
  }, 100);
});
if(S.scriptUrl){ fetchSync(); startPolling(); }
setInterval(()=>{
  // Only update the sync status text, don't re-render the whole page
  // This prevents keyboard dismissal on mobile
  const metaEl = document.querySelector('.header-meta');
  if(metaEl && !S.showSettings){
    const configured=!!S.scriptUrl;
    const dotCls=!configured?"":S.syncing?"syncing":S.syncError?"err":"live";
    const syncMsg=!configured?"Not synced — add Script URL in Settings"
      :S.syncing?"Syncing…"
      :S.syncError?S.syncError
      :S.lastSynced?"Synced "+fmtTime(S.lastSynced)+(S.userName?" by "+S.userName:"")
      :"Connected";
    metaEl.innerHTML='<span class="sdot '+dotCls+'"></span><span>'+syncMsg+'</span>'
      +(configured&&!S.syncing?'<span style="cursor:pointer" onclick="fetchSync()">↻</span>':"");
  }
},30000);
</script>
</body>
</html>
